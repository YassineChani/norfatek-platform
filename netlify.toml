[build]
  base      = "norfat-frontend"
  command   = "npm run build -- --configuration=production"
  publish   = "dist/norfat-frontend/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
